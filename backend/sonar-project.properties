# Análise do SonarQube para o backend (Python/FastAPI).
#
# Fica em `backend/`, e não na raiz do repositório, de propósito: a raiz da
# análise precisa ser a mesma pasta de onde o pytest roda, senão os caminhos
# dentro do `coverage.xml` não resolvem e a cobertura é descartada em silêncio.
# É também a raiz do projeto Python — `pytest.ini`, `requirements.txt` e
# `alembic.ini` estão todos aqui. Rode o scanner com esta pasta como contexto.
#
# NÃO colocar `sonar.host.url` nem `sonar.token` aqui: os dois vão por variável
# de ambiente no momento de rodar, para o token nunca encostar no repositorio.

sonar.projectKey=planejamento-financeiro-back
sonar.projectName=planejamento-financeiro-back

# `app` é o código da aplicação. `scripts/` também é código, mas é ferramenta
# administrativa rodada à mão, sem cobertura de teste — deixar de fora evita
# puxar o número da cobertura para baixo por algo que não se pretende testar.
sonar.sources=app
sonar.tests=tests

# Produção roda 3.12 (Dockerfile e CI) e o desenvolvimento aqui roda 3.14.
# Declarar as duas faz o Sonar apontar só o que vale nas duas — e o código
# precisa funcionar nas duas de verdade.
sonar.python.version=3.12, 3.14

sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8

# Nada aqui é código a analisar. `migracoes/` ficaria de fora de qualquer forma
# por não estar em `sonar.sources`, mas vai listado para continuar de fora se
# alguém ampliar as fontes um dia.
sonar.exclusions=\
    .venv/**,\
    **/__pycache__/**,\
    **/*.db,\
    **/*.db.bak-*,\
    migracoes/**,\
    htmlcov/**
